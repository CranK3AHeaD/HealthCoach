<style>
:root {
  --r: 18px;
  --r-s: 12px;
  --pad: 20px;
  --nav-h: 70px;
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-h: 'Fraunces', Georgia, 'Times New Roman', serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --messing: linear-gradient(135deg, #F1DFAE 0%, #D4B06A 30%, #B48B45 62%, #8A6629 100%);
}
html[data-lk="nacht"] {
  --bg: #07090E;
  --bg-2: #0C1018;
  --card: #10151F;
  --card-2: #161C28;
  --ink: #ECE8E0;
  --ink-2: #BDB8AE;
  --muted: #7C8291;
  --line: rgba(255,255,255,.06);
  --line-2: rgba(255,255,255,.11);
  --hi: rgba(255,255,255,.07);
  --accent: #CFAA62;
  --accent-ink: #17120A;
  --accent-soft: rgba(207,170,98,.10);
  --glow: rgba(207,170,98,.16);
  --shadow: 0 24px 48px -20px rgba(0,0,0,.85);
  --steel-l: #3A4252; --steel-d: #1E2430;
  --star: rgba(255,255,255,.5);
  color-scheme: dark;
}
html[data-lk="morgen"] {
  --bg: #EFEBE3;
  --bg-2: #E8E3D9;
  --card: #FAF8F4;
  --card-2: #F2EEE6;
  --ink: #171B24;
  --ink-2: #3E4350;
  --muted: #7A7C84;
  --line: rgba(23,27,36,.08);
  --line-2: rgba(23,27,36,.15);
  --hi: rgba(255,255,255,.9);
  --accent: #A07B36;
  --accent-ink: #1A140A;
  --accent-soft: rgba(160,123,54,.10);
  --glow: rgba(160,123,54,.13);
  --shadow: 0 20px 40px -22px rgba(40,30,10,.35);
  --steel-l: #C9C4BA; --steel-d: #9D978B;
  --star: rgba(0,0,0,0);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 500 16px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
svg { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
.ic { width: 1.15em; height: 1.15em; flex: none; }
.ic-txt { line-height: 1; }

/* ---------- Atmosphäre ---------- */
.sky {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(1px 1px at 12% 18%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 78% 9%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 64% 34%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 22% 64%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 90% 58%, var(--star), transparent 60%),
    radial-gradient(1px 1px at 45% 87%, var(--star), transparent 60%),
    radial-gradient(1.3px 1.3px at 6% 92%, var(--star), transparent 60%),
    radial-gradient(1.3px 1.3px at 52% 12%, var(--star), transparent 60%),
    radial-gradient(1100px 620px at 50% -8%, var(--glow), transparent 65%),
    radial-gradient(700px 500px at 110% 100%, rgba(90,110,150,.08), transparent 70%),
    var(--bg);
}
.korn {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- Kopfzeile ---------- */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 14px) var(--pad) 14px;
  background: linear-gradient(var(--bg) 55%, transparent);
}
.brand { display: flex; align-items: center; gap: 11px; font: 600 12px var(--font); letter-spacing: .32em; text-transform: uppercase; color: var(--ink-2); }
.brand-rose { width: 26px; height: 26px; }
.brand-rose circle { stroke: var(--accent); stroke-opacity: .45; }
.brand-rose path { fill: var(--steel-l); stroke: none; }
.brand-rose path.n { fill: var(--accent); }
.top-title { flex: 1; margin: 0; font: 400 19px var(--font-h); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; transition: background .3s; }
.sync.laeuft { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: puls 1.2s infinite; }
.sync.fehler { background: #C8695F; }
@keyframes puls { 50% { opacity: .3; } }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--line-2); background: color-mix(in srgb, var(--card) 70%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.icon-btn svg { width: 19px; height: 19px; }

/* ---------- Inhalt ---------- */
.view {
  max-width: 720px; margin: 0 auto;
  padding: 4px var(--pad) calc(var(--nav-h) + env(safe-area-inset-bottom) + 48px);
  outline: none;
  animation: rein .5s var(--ease);
}
@keyframes rein { from { opacity: 0; transform: translateY(8px); } }

h2 { font: 300 32px/1.15 var(--font-h); margin: 10px 0 8px; letter-spacing: -.015em; font-variation-settings: 'opsz' 96; }
h3 {
  display: flex; align-items: center; gap: 12px;
  font: 700 11px var(--font); letter-spacing: .26em; text-transform: uppercase; color: var(--muted);
  margin: 36px 0 14px;
}
h3::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-2), transparent); }
p { margin: 0 0 10px; }
.leise { color: var(--muted); }
.klein { font-size: 13px; }

/* Fläche: gemeinsame Optik für alle Karten */
.flaeche, .karte, .kachel, .sit, .block, .anker, .regel-gross {
  background:
    linear-gradient(180deg, var(--hi), transparent 42%),
    var(--card);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 var(--hi), var(--shadow);
}

/* ---------- Startseite ---------- */
.gruss { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; margin-top: 6px; }
.hero { position: relative; display: grid; place-items: center; margin: 18px 0 10px; }
.rose { width: min(300px, 78vw); aspect-ratio: 1; overflow: visible; filter: drop-shadow(0 30px 40px rgba(0,0,0,.45)); }
.rose .bezel { stroke: url(#messing); stroke-width: 1.4; }
.rose .bezel-2 { stroke: var(--line-2); stroke-width: .6; }
.rose .ring-p { stroke: var(--accent); stroke-opacity: .35; stroke-width: .6; stroke-dasharray: 1 3.2; }
.rose .ring-i { stroke: var(--line-2); stroke-width: .6; }
.rose .tick { stroke: var(--muted); stroke-opacity: .55; stroke-width: .6; }
.rose .tick-m { stroke: var(--ink-2); stroke-width: .9; }
.rose .tick-h { stroke: url(#messing); stroke-width: 1.6; }
.rose text { stroke: none; text-anchor: middle; }
.rose .grad { fill: var(--muted); font: 600 6.5px var(--font); letter-spacing: .05em; }
.rose .himmel { fill: var(--ink-2); font: 400 13px var(--font-h); }
.rose .nord-t { fill: var(--accent); }
.rose .neben-l { fill: var(--steel-l); stroke: none; opacity: .75; }
.rose .neben-d { fill: var(--steel-d); stroke: none; opacity: .75; }
.rose .haupt-l { fill: var(--steel-l); stroke: none; }
.rose .haupt-d { fill: var(--steel-d); stroke: none; }
.rose .nord-l { fill: url(#messing); stroke: none; }
.rose .nord-d { fill: url(#messingD); stroke: none; }
.rose .mitte { fill: var(--bg); stroke: url(#messing); stroke-width: 1.4; }
.rose .mitte-p { fill: var(--accent); stroke: none; }
.rose .stern { transform-origin: 100px 100px; animation: pendel 12s ease-in-out infinite; }
.rose .drehring { transform-origin: 100px 100px; animation: dreh 160s linear infinite; }
@keyframes pendel { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }

.btn-jetzt {
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%; padding: 19px; margin-top: 10px;
  background: var(--messing); color: var(--accent-ink);
  border-radius: var(--r); font-weight: 700; font-size: 16px; letter-spacing: .04em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.25), 0 18px 40px -14px rgba(207,170,98,.55);
  transition: transform .2s var(--ease);
}
.btn-jetzt::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
  animation: glanz 7s ease-in-out infinite 2s;
}
@keyframes glanz { 0%, 70% { left: -60%; } 100% { left: 130%; } }
.btn-jetzt:active { transform: scale(.985); }
.btn-jetzt svg { width: 20px; height: 20px; stroke-width: 1.8; }

.anker { margin-top: 26px; padding: 26px 24px 24px; border-radius: var(--r); position: relative; overflow: hidden; cursor: pointer; }
.anker::before {
  content: '\201C'; position: absolute; right: 18px; top: -6px;
  font: 400 150px/1 var(--font-h); color: var(--accent); opacity: .08;
}
.anker .label { display: flex; align-items: center; gap: 10px; font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.anker .label::before { content: ''; width: 22px; height: 1px; background: var(--accent); }
.anker blockquote { margin: 14px 0 0; font: italic 300 23px/1.42 var(--font-h); letter-spacing: -.005em; }
.anker .quelle { margin-top: 14px; font-size: 13px; color: var(--muted); }

/* ---------- Bereich-Kacheln ---------- */
.kacheln { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 560px) { .kacheln { grid-template-columns: repeat(3, 1fr); } }
.kachel {
  position: relative; overflow: hidden; text-align: left; padding: 18px 16px 16px; border-radius: var(--r);
  display: flex; flex-direction: column; gap: 12px; min-height: 128px;
  transition: transform .25s var(--ease), border-color .25s;
}
.kachel::before {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--c), transparent); opacity: .7;
}
.kachel:hover { border-color: var(--line-2); transform: translateY(-2px); }
.kachel:active { transform: scale(.98); }
.kachel .wm { position: absolute; right: -14px; bottom: -16px; color: var(--c); opacity: .09; }
.kachel .wm .ic { width: 92px; height: 92px; stroke-width: 1; }
.sym {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
  color: var(--c, var(--accent));
  background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--c, var(--accent)) 26%, transparent), color-mix(in srgb, var(--c, var(--accent)) 6%, transparent));
  border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 38%, transparent);
  box-shadow: inset 0 1px 0 var(--hi);
}
.sym .ic { width: 20px; height: 20px; }
.sym.gross { width: 54px; height: 54px; border-radius: 16px; }
.sym.gross .ic { width: 26px; height: 26px; }
.kachel .name { font-weight: 700; line-height: 1.25; letter-spacing: .005em; }
.kachel .zahl { font-size: 11px; color: var(--muted); margin-top: auto; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.bereich-kopf { display: flex; align-items: center; gap: 16px; margin: 6px 0 4px; }
.bereich-kopf h2 { margin: 0; }

/* ---------- Regel-Karten ---------- */
.liste { display: flex; flex-direction: column; gap: 12px; }
.karte {
  position: relative; text-align: left; width: 100%;
  padding: 18px 18px 18px 22px; border-radius: var(--r);
  transition: border-color .25s, transform .25s var(--ease);
}
.karte::before { content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 2px; border-radius: 0 2px 2px 0; background: var(--c, var(--line-2)); box-shadow: 0 0 12px var(--c); }
.karte:hover { border-color: var(--line-2); transform: translateY(-1px); }
.karte .kopf { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--muted); letter-spacing: .2em; text-transform: uppercase; font-weight: 700; }
.karte .titel { font: 400 19px/1.3 var(--font-h); margin: 8px 0 4px; }
.karte .kern { color: var(--ink-2); font-size: 15px; }
.karte .stern { margin-left: auto; color: var(--accent); font-size: 13px; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.badge.entwurf { border-style: dashed; }
.badge.pruefen { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 15px; border-radius: 99px; font-size: 14px; font-weight: 600;
  border: 1px solid var(--line-2); background: color-mix(in srgb, var(--card) 80%, transparent); color: var(--ink-2);
  transition: all .2s var(--ease);
}
.chip .ic { width: 16px; height: 16px; color: var(--accent); }
.chip.an { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 70%, transparent); color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); }
.chip.klein { padding: 7px 13px; font-size: 13px; }
.chips-scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; margin: 0 calc(var(--pad) * -1); padding-left: var(--pad); padding-right: var(--pad); scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.chips-scroll .chip { flex: none; }

/* ---------- Was ist gerade los ---------- */
.situationen { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sit {
  padding: 18px 16px; border-radius: var(--r); text-align: left;
  display: flex; flex-direction: column; gap: 14px; font-weight: 600; line-height: 1.3; font-size: 15px;
  transition: all .25s var(--ease);
}
.sit .s { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); border: 1px solid var(--line-2); background: var(--accent-soft); }
.sit .s .ic { width: 19px; height: 19px; }
.sit.an { border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), 0 0 30px -8px var(--glow); }
.sit.an .s { background: var(--messing); color: var(--accent-ink); border-color: transparent; }

.atmen { display: grid; place-items: center; padding: 30px 0 10px; }
.atem-kreis {
  width: 150px; height: 150px; border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); display: grid; place-items: center;
  color: var(--ink-2); font: italic 300 17px var(--font-h);
  background: radial-gradient(circle, var(--glow), transparent 70%);
  box-shadow: 0 0 60px -10px var(--glow), inset 0 0 30px var(--accent-soft);
  animation: atem 10s ease-in-out infinite;
}
@keyframes atem { 0%,100% { transform: scale(.74); } 40% { transform: scale(1); } }

.regel-gross { padding: 26px 24px; border-radius: var(--r); position: relative; overflow: hidden; }
.regel-gross::before { content: ''; position: absolute; left: 24px; right: 24px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--c, var(--accent)), transparent); }
.regel-gross .meta { text-transform: uppercase; letter-spacing: .2em; font-size: 10.5px; font-weight: 700; }
.regel-gross .kern { font: 300 23px/1.42 var(--font-h); margin: 10px 0 16px; }

/* ---------- Detail ---------- */
.detail-kern { font: italic 300 27px/1.38 var(--font-h); margin: 8px 0 4px; color: var(--ink); }
.meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
.meta .punkt { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.block { padding: 20px; border-radius: var(--r); }
.block p:last-child { margin: 0; }
.schritte { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; counter-reset: s; }
.schritte li { display: flex; gap: 14px; align-items: flex-start; padding: 11px 4px; cursor: pointer; border-bottom: 1px solid var(--line); }
.schritte li:last-child { border-bottom: 0; }
.schritte li .kreis { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-2); margin-top: 0; display: grid; place-items: center; transition: all .25s var(--ease); position: relative; }
.schritte li .kreis::before { counter-increment: s; content: counter(s); font-size: 11px; font-weight: 700; color: var(--muted); }
.schritte li .kreis svg { position: absolute; width: 13px; height: 13px; opacity: 0; stroke-width: 2.4; }
.schritte li.erledigt .kreis { background: var(--messing); border-color: transparent; color: var(--accent-ink); }
.schritte li.erledigt .kreis::before { opacity: 0; }
.schritte li.erledigt .kreis svg { opacity: 1; }
.schritte li.erledigt span:last-child { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }

.aktionen { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 13px 19px; border-radius: var(--r-s); font-weight: 700; font-size: 14.5px; letter-spacing: .01em;
  background: linear-gradient(180deg, var(--hi), transparent), var(--card-2); border: 1px solid var(--line-2); color: var(--ink);
  box-shadow: inset 0 1px 0 var(--hi);
  transition: transform .15s var(--ease), border-color .2s;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-2)); }
.btn:active { transform: scale(.98); }
.btn svg { width: 18px; height: 18px; }
.btn.primaer { background: var(--messing); color: var(--accent-ink); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 10px 26px -12px rgba(207,170,98,.6); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.gefahr { color: #D98A80; border-color: rgba(217,138,128,.3); background: transparent; box-shadow: none; }
.btn.voll { width: 100%; }

.reflex { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.reflex:last-child { border-bottom: 0; }
.reflex .w { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; border: 1px solid var(--line-2); color: var(--muted); }
.reflex .w.geholfen { border-color: transparent; background: var(--messing); color: var(--accent-ink); }
.reflex .datum { font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }

/* ---------- Formulare ---------- */
.feld { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
.feld label, .feld .label { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.feld .hilfe { font-size: 13px; color: var(--muted); margin-top: -3px; }
input[type=text], input[type=search], textarea, select {
  width: 100%; padding: 14px 16px; border-radius: var(--r-s);
  background: color-mix(in srgb, var(--bg-2) 85%, transparent); border: 1px solid var(--line-2); outline: none;
  transition: border-color .2s, box-shadow .2s; font-size: 16px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.18);
}
input:focus, textarea:focus, select:focus { border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: inset 0 2px 6px rgba(0,0,0,.18), 0 0 0 4px var(--accent-soft); }
textarea { resize: vertical; min-height: 90px; line-height: 1.55; }
#fKern { font: 300 19px/1.45 var(--font-h); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 55%, calc(100% - 15px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.segment { display: flex; padding: 4px; gap: 4px; border: 1px solid var(--line-2); border-radius: 14px; background: color-mix(in srgb, var(--bg-2) 85%, transparent); }
.segment button { flex: 1; padding: 10px 6px; font-size: 14px; font-weight: 600; color: var(--muted); border-radius: 10px; transition: all .2s var(--ease); }
.segment button.an { background: linear-gradient(180deg, var(--hi), transparent), var(--card-2); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 4px 12px -6px rgba(0,0,0,.5); }
.farben { display: flex; flex-wrap: wrap; gap: 12px; }
.farben button { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--c) 70%, white), var(--c)); border: 2px solid var(--bg-2); outline: 1px solid var(--line-2); }
.farben button.an { outline: 2px solid var(--accent); }
.ikon-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
.ikon-raster button { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--ink-2); background: var(--card); }
.ikon-raster button .ic { width: 21px; height: 21px; }
.ikon-raster button.an { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.suche { position: relative; margin: 6px 0 14px; }
.suche svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.suche input { padding-left: 46px; border-radius: 99px; }

.leer { text-align: center; padding: 44px 12px; color: var(--muted); }
.leer .gross { font: italic 300 22px/1.35 var(--font-h); color: var(--ink-2); margin-bottom: 8px; }
.leer .btn { margin-top: 14px; }

.zeile {
  display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  padding: 16px 4px; border-bottom: 1px solid var(--line); transition: padding .2s var(--ease);
}
.zeile:hover { padding-left: 8px; }
.zeile .sym { width: 38px; height: 38px; border-radius: 12px; font-family: var(--font-h); font-size: 17px; }
.zeile .txt { flex: 1; min-width: 0; font-weight: 600; }
.zeile .txt small { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }
.zeile .pfeil { width: 16px; height: 16px; color: var(--muted); }

/* ---------- Navigation ---------- */
.nav {
  position: fixed; left: 12px; right: 12px; z-index: 20;
  bottom: calc(10px + env(safe-area-inset-bottom));
  max-width: 520px; margin: 0 auto;
  display: flex; justify-content: space-around; align-items: center;
  height: var(--nav-h); padding: 0 6px;
  border-radius: 24px;
  background: color-mix(in srgb, var(--card) 72%, transparent);
  backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--line-2);
  box-shadow: inset 0 1px 0 var(--hi), 0 20px 50px -14px rgba(0,0,0,.7);
}
.nav button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; transition: color .2s; }
.nav button svg { width: 22px; height: 22px; }
.nav button.aktiv { color: var(--ink); }
.nav button.aktiv svg { color: var(--accent); }
.nav button.aktiv::after { content: ''; position: absolute; bottom: -9px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.nav .nav-neu {
  width: 52px; height: 52px; border-radius: 50%; margin-top: -26px;
  background: var(--messing); color: var(--accent-ink); justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 0 0 6px var(--bg), 0 12px 30px -8px rgba(207,170,98,.6);
}
.nav .nav-neu svg { width: 24px; height: 24px; stroke-width: 2; }

/* ---------- Modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.modal-back { position: absolute; inset: 0; background: rgba(3,4,8,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .25s; }
.modal-box {
  position: relative; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
  background: linear-gradient(180deg, var(--hi), transparent 30%), var(--bg-2);
  border: 1px solid var(--line-2); border-bottom: 0;
  border-radius: 26px 26px 0 0; padding: 30px var(--pad) calc(26px + env(safe-area-inset-bottom));
  box-shadow: 0 -20px 60px rgba(0,0,0,.5);
  animation: hoch .35s var(--ease);
}
.modal-box::before { content: ''; position: absolute; top: 10px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 4px; background: var(--line-2); }
@media (min-width: 600px) { .modal { align-items: center; } .modal-box { border-radius: 26px; border-bottom: 1px solid var(--line-2); } .modal-box::before { display: none; } }
.modal-box h2 { font-size: 26px; margin-top: 0; }
@keyframes hoch { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px);
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60;
  background: color-mix(in srgb, var(--card-2) 90%, transparent); color: var(--ink);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  padding: 12px 20px; border-radius: 99px; box-shadow: var(--shadow);
  font-size: 14px; font-weight: 600; transition: all .35s var(--ease); max-width: 90vw;
  width: max-content; text-align: center;
}
.toast.zeigen { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Laden ---------- */
.laden { display: grid; place-items: center; gap: 22px; padding-top: 24vh; color: var(--muted); font: italic 300 17px var(--font-h); }
.laden-rose { width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line-2); border-top-color: var(--accent); animation: dreh 1.4s linear infinite; box-shadow: 0 0 30px -6px var(--glow); }
@keyframes dreh { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
