function startausstattung() {

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function sichere(tabelle, obj) {
  if (!obj.id) obj.id = uuid();
  var jetzt = new Date().toISOString();
  if (tabelle === 'Regeln') { if (!obj.erstellt) obj.erstellt = jetzt; obj.geaendert = jetzt; }
  if (tabelle === 'Reflexionen' && !obj.datum) obj.datum = jetzt;
  var liste = D[tabelle];
  var i = liste.findIndex(function (x) { return x.id === obj.id; });
  if (i > -1) liste[i] = obj; else liste.push(obj);
  cache();
  outbox.push({ op: 'speichere', tabelle: tabelle, obj: obj });
  ls('lk_outbox', outbox);
  
  abarbeiten();
  return obj;
}

function entferne(tabelle, id) {
  D[tabelle] = D[tabelle].filter(function (x) { return x.id !== id; });
  if (tabelle === 'Regeln') D.Reflexionen = D.Reflexionen.filter(function (r) { return r.regelId !== id; });
  cache();
  outbox.push({ op: 'loesche', tabelle: tabelle, id: id });
  ls('lk_outbox', outbox);
  
  abarbeiten();
}

function setSync(z) { var el = $('#sync'); el.className = 'sync' + (z ? ' ' + z : ''); }

function abarbeiten() {
  if (arbeitet || !outbox.length) return;
  arbeitet = true;
  setSync('laeuft');
  var a = outbox[0];
  var p = a.op === 'speichere' ? rufe('speichere', a.tabelle, a.obj) : rufe('loesche', a.tabelle, a.id);
  p.then(function () {
    outbox.shift();
    ls('lk_outbox', outbox);
    
    arbeitet = false;
    fehlerGemeldet = false;
    if (outbox.length) return abarbeiten();
    setSync('');
    if (nachladen) { nachladen = false; laden(); }
  }).catch(function () {
    arbeitet = false;
    setSync('fehler');
    if (!fehlerGemeldet) { toast('Gerade keine Verbindung. Ich speichere, sobald es wieder geht.'); fehlerGemeldet = true; }
    clearTimeout(retryTimer);
    retryTimer = setTimeout(abarbeiten, 20000);
  });
}

function laden() {
  return rufe('ladeAlles').then(function (d) {
    if (outbox.length) { nachladen = true; return; }
    TABELLEN.forEach(function (t) { D[t] = d[t] || []; });
    D.sheetUrl = d.sheetUrl || '';
    cache();
    if (route.view !== 'edit' && !kiAktiv && !tipptGerade()) render(true);
  }).catch(function (e) {
    if (!D.Regeln.length && !D.Bereiche.length) {
      $('#view').innerHTML =
        '<div class="leer"><div class="gross">Der Kompass findet gerade keine Verbindung.</div>' +
        '<p>' + esc(e && e.message ? e.message : 'Unbekannter Fehler') + '</p>' +
        '<button class="btn primaer" data-act="neuLaden">Noch einmal versuchen</button></div>';
    } else {
      setSync('fehler');
    }
  });
}

    if (s) return s;
    return String(a.titel || a.kernsatz).localeCompare(String(b.titel || b.kernsatz), 'de');
  });
}

function rose() {

    '<text class="himmel" x="' + (100 + 66) + '" y="104">O</text><text class="himmel" x="100" y="' + (100 + 66 + 4) + '">S</text>' +
    '<text class="himmel" x="' + (100 - 66) + '" y="104">W</text>';
  return '<svg class="rose" viewBox="0 0 200 200" aria-hidden="true"><defs>' +
    '<linearGradient id="messing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3E2B3"/><stop offset=".45" stop-color="#C9A45C"/><stop offset="1" stop-color="#7A5A24"/></linearGradient>' +

VIEWS.kompass = function () {
  var h = new Date().getHours();
  var gruss = h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 17 ? 'Guten Tag' : h < 22 ? 'Guten Abend' : 'Gute Nacht';
  var name = ls('lk_name');
  var html = '<div class="gruss">' + esc(gruss + (name ? ', ' + name : '')) + '</div>';
  html += anspKopf();

  var pool = D.Regeln.filter(function (r) { return r.kernsatz && r.status !== 'entwurf'; });
  if (pool.length) {
    var tag = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
    var a = pool.sort(function (x, y) { return x.id < y.id ? -1 : 1; })[tag % pool.length];
    html += '<div class="anker" data-act="regel" data-id="' + esc(a.id) + '" role="button">' +
      '<div class="label">Ankersatz für heute</div><blockquote>' + esc(a.kernsatz) + '</blockquote>' +
      (a.titel ? '<div class="quelle">' + esc(a.titel) + '</div>' : '') + '</div>';
  }
  return html;
};
function heuteKarte() {
  var h = new Date().getHours(), art = h < 14 ? 'morgen' : 'abend', ci = checkinHeute(art);
  var n = dankAm(heute()).length, wt = new Date().getDay();
  var zeile = function (act, id, sym, titel, sub, fertig) {
    return '<button class="heute-z' + (fertig ? ' fertig' : '') + '" data-act="' + act + '" data-id="' + id + '"><span class="hk">' + (fertig ? svg('haken') : ikon(sym)) + '</span>' +
      '<span class="txt">' + titel + '<small>' + sub + '</small></span>' + svg('pfeil').replace('<svg', '<svg class="pfeil"') + '</button>';
  };
  var html = '<h3>Heute für dich</h3><div class="block heute">';
  html += zeile('checkin', art, art === 'morgen' ? 'sonne' : 'mond', CHECK[art].titel, ci ? 'Erledigt' : '10 Sekunden', !!ci);
  html += zeile('nav', 'dank', 'herz', 'Dankbarkeit', n >= DANK_N ? n + ' Dinge notiert' : n + ' von ' + DANK_N + ' notiert', n >= DANK_N);
  if (wt === 0 || wt === 1) html += zeile('nav', 'rueckblick', 'weg', 'Wochenrückblick', 'Deine letzten 7 Tage', false);
  return html + '</div>';
}

function zeigeListe() {
  var q = filter.q.trim().toLowerCase();
  var liste = D.Regeln.filter(function (r) {
    if (filter.fav && r.favorit !== 'ja') return false;
    if (filter.bereich && r.bereichId !== filter.bereich) return false;
    if (filter.status && (r.status || 'gilt') !== filter.status) return false;
    if (q) {
      var sitNamen = ids(r.situationen).map(function (i) { var s = situation(i); return s ? s.name : ''; }).join(' ');
      var heu = [r.titel, r.kernsatz, r.warum, r.schritte, sitNamen].join(' ').toLowerCase();
      return q.split(/\s+/).every(function (w) { return heu.indexOf(w) > -1; });
    }
    return true;
  });
  $('#regelListe').innerHTML = liste.length
    ? '<div class="liste">' + sortRegeln(liste).map(karte).join('') + '</div>'

/* =========================================================

var ANSP_FARBE = ['#7E9C86', '#7E9C86', '#8FA383', '#A3A67C', '#B9A46E', '#C9A45C', '#D39A62', '#DB9068', '#E08A70', '#E07E68', '#DE7060'];

  };
  var spitze = function (g, L, w, cls) {
    return '<path class="' + cls + '-l" d="M100 100L' + P(L, g) + 'L' + P(w, g - 45) + 'Z"/>' +

  var stern = '';

    '<radialGradient id="glanz" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="var(--glow)"/><stop offset="1" stop-color="var(--glow)" stop-opacity="0"/></radialGradient>' +

/* Tagesverlauf: feste Zeitachse von 5 bis 24 Uhr mit festen Marken 6, 12, 15, 18 und 21 Uhr.
   Linien als SVG, das sich nur in der Breite streckt; Punkte und Uhrzeiten als HTML in fester Größe.
   Die wichtigsten Maße stehen direkt am Element, damit die Grafik auch ohne die Styles-Datei stimmt. */

function tagesVerlauf() {
  var tag = heute();

  var px = function (d) { var t = new Date(d), h = t.getHours() + t.getMinutes() / 60; return Math.max(0, Math.min(100, (h - TV_VON) / (TV_BIS - TV_VON) * 100)); };
  var pxH = function (h) { return (h - TV_VON) / (TV_BIS - TV_VON) * 100; };
  var py = function (v) { return 100 - v * 10; };
  var ns = ' vector-effect="non-scaling-stroke"';
  var g = '';
  [[0, 30, 'rgba(224,138,112,.10)'], [30, 60, 'rgba(201,164,92,.07)'], [60, 100, 'rgba(126,156,134,.08)']].forEach(function (b) {
    g += '<rect x="0" y="' + b[0] + '" width="100" height="' + (b[1] - b[0]) + '" style="fill:' + b[2] + ';stroke:none"/>';
  });
  [0, 50, 100].forEach(function (y) { g += '<line x1="0" x2="100" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,.08)" stroke-width="1"' + ns + '/>'; });
  TV_MARKEN.forEach(function (h) { var x = pxH(h); g += '<line x1="' + x + '" x2="' + x + '" y1="0" y2="100" stroke="rgba(255,255,255,.06)" stroke-width="1"' + ns + '/>'; });
  var jetzt = px(new Date());
  g += '<line x1="' + jetzt + '" x2="' + jetzt + '" y1="0" y2="100" stroke="#C9A45C" stroke-opacity=".5" stroke-width="1" stroke-dasharray="2 3"' + ns + '/>';
  if (e.length > 1) {
    var pts = e.map(function (x) { return px(x.datum).toFixed(2) + ',' + py(+x.vorher); });
    g += '<polygon points="' + px(e[0].datum).toFixed(2) + ',100 ' + pts.join(' ') + ' ' + px(e[e.length - 1].datum).toFixed(2) + ',100" fill="rgba(201,164,92,.12)" stroke="none"/>';
    g += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#C9A45C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + ns + '/>';
  }
  var punkte = e.map(function (x) {
    return '<i style="position:absolute;left:' + px(x.datum).toFixed(2) + '%;top:' + py(+x.vorher) + '%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;border:1.5px solid #0d1017;background:' + ANSP_FARBE[+x.vorher] + '" title="' +
      new Date(x.datum).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr: ' + x.vorher + '/10"></i>' +
      '<b style="position:absolute;left:' + px(x.datum).toFixed(2) + '%;top:' + py(+x.vorher) + '%;transform:translate(-50%,-150%);font-size:10.5px;font-weight:700;line-height:1;color:' + ANSP_FARBE[+x.vorher] + '">' + x.vorher + '</b>';
  }).join('');
  var achse = TV_MARKEN.map(function (h) {
    return '<span style="position:absolute;left:' + pxH(h) + '%;top:0;transform:translateX(-50%);font-size:10.5px;font-weight:400;line-height:16px;letter-spacing:0;white-space:nowrap;color:var(--muted)">' + h + ' Uhr</span>';
  }).join('');
  var yAchse = [[10, 'am Limit'], [5, 'angespannt'], [0, 'ruhig']].map(function (y) {
    return '<span style="position:absolute;right:0;top:' + py(y[0]) + '%;transform:translateY(-50%);text-align:right;line-height:1.1;white-space:nowrap;letter-spacing:0">' +
      '<b style="font-size:11px;font-weight:700;color:' + ANSP_FARBE[y[0]] + '">' + y[0] + '</b> <small style="font-size:9.5px;color:var(--muted)">' + y[1] + '</small></span>';
  }).join('');
  var unter;
