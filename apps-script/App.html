function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function sichere(tabelle, obj) {
  if (!obj.id) obj.id = uuid();
  var jetzt = new Date().toISOString();
  if (tabelle === 'Regeln') { if (!obj.erstellt) obj.erstellt = jetzt; obj.geaendert = jetzt; }
  if (tabelle === 'Reflexionen' && !obj.datum) obj.datum = jetzt;
  var liste = D[tabelle];
  var i = liste.findIndex(function (x) { return x.id === obj.id; });
  if (i > -1) liste[i] = obj; else liste.push(obj);
  cache();
  outbox.push({ op: 'speichere', tabelle: tabelle, obj: obj });
  ls('lk_outbox', outbox);
  
  abarbeiten();
  return obj;
}

function entferne(tabelle, id) {
  D[tabelle] = D[tabelle].filter(function (x) { return x.id !== id; });
  if (tabelle === 'Regeln') D.Reflexionen = D.Reflexionen.filter(function (r) { return r.regelId !== id; });
  cache();
  outbox.push({ op: 'loesche', tabelle: tabelle, id: id });
  ls('lk_outbox', outbox);
  
  abarbeiten();
}

function setSync(z) { var el = $('#sync'); el.className = 'sync' + (z ? ' ' + z : ''); }

function abarbeiten() {
  if (arbeitet || !outbox.length) return;
  arbeitet = true;
  setSync('laeuft');
  var a = outbox[0];
  var p = a.op === 'speichere' ? rufe('speichere', a.tabelle, a.obj) : rufe('loesche', a.tabelle, a.id);
  p.then(function () {
    outbox.shift();
    ls('lk_outbox', outbox);
    
    arbeitet = false;
    fehlerGemeldet = false;
    if (outbox.length) return abarbeiten();
    setSync('');
    if (nachladen) { nachladen = false; laden(); }
  }).catch(function () {
    arbeitet = false;
    setSync('fehler');
    if (!fehlerGemeldet) { toast('Gerade keine Verbindung. Ich speichere, sobald es wieder geht.'); fehlerGemeldet = true; }
    clearTimeout(retryTimer);
    retryTimer = setTimeout(abarbeiten, 20000);
  });
}

function laden() {
  return rufe('ladeAlles').then(function (d) {
    if (outbox.length) { nachladen = true; return; }
    TABELLEN.forEach(function (t) { D[t] = d[t] || []; });

    cache();
    if (route.view !== 'edit' && !kiAktiv && !tipptGerade()) render(true);

        '<button class="btn primaer" data-act="neuLaden">Noch einmal versuchen</button></div>';
    } else {
      setSync('fehler');
    }
  });
}

  return '<svg class="rose" viewBox="0 0 200 200" aria-hidden="true"><defs>' +

VIEWS.kompass = function () {
  var h = new Date().getHours();
  var gruss = h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 17 ? 'Guten Tag' : h < 22 ? 'Guten Abend' : 'Gute Nacht';
  var name = ls('lk_name');
  var html = '<div class="gruss">' + esc(gruss + (name ? ', ' + name : '')) + '</div>';
  html += anspKopf();
  html += fwStartKarte();

  var pool = D.Regeln.filter(function (r) { return r.kernsatz && r.status !== 'entwurf'; });
  if (pool.length) {
    var tag = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
    var a = pool.sort(function (x, y) { return x.id < y.id ? -1 : 1; })[tag % pool.length];
    html += '<div class="anker" data-act="regel" data-id="' + esc(a.id) + '" role="button">' +
      '<div class="label ns">' + nordstern() + 'Nordstern für heute</div><blockquote>' + esc(a.kernsatz) + '</blockquote>' +
      (a.titel ? '<div class="quelle">' + esc(a.titel) + '</div>' : '') + '</div>';
  }
  return html;
};
function heuteKarte() {
  var h = new Date().getHours(), art = h < 14 ? 'morgen' : 'abend', ci = checkinHeute(art);
  var n = dankAm(heute()).length, wt = new Date().getDay();
  var zeile = function (act, id, sym, titel, sub, fertig) {
    return '<button class="heute-z' + (fertig ? ' fertig' : '') + '" data-act="' + act + '" data-id="' + id + '"><span class="hk">' + (fertig ? svg('haken') : ikon(sym)) + '</span>' +
      '<span class="txt">' + titel + '<small>' + sub + '</small></span>' + svg('pfeil').replace('<svg', '<svg class="pfeil"') + '</button>';
  };
  var html = '<h3>Heute für dich</h3><div class="block heute">';
  html += zeile('checkin', art, art === 'morgen' ? 'sonne' : 'mond', CHECK[art].titel, ci ? 'Erledigt' : '10 Sekunden', !!ci);
  html += zeile('nav', 'dank', 'herz', 'Dankbarkeit', n >= DANK_N ? n + ' Dinge notiert' : n + ' von ' + DANK_N + ' notiert', n >= DANK_N);
  if (wt === 0 || wt === 1) html += zeile('nav', 'rueckblick', 'weg', 'Wochenrückblick', 'Deine letzten 7 Tage', false);
  return html + '</div>';
}

function zeigeListe() {
  var q = filter.q.trim().toLowerCase();
  var liste = D.Regeln.filter(function (r) {
    if (filter.fav && r.favorit !== 'ja') return false;
    if (filter.bereich && r.bereichId !== filter.bereich) return false;
    if (filter.status && (r.status || 'gilt') !== filter.status) return false;
    if (q) {
      var sitNamen = ids(r.situationen).map(function (i) { var s = situation(i); return s ? s.name : ''; }).join(' ');
      var heu = [r.titel, r.kernsatz, r.warum, r.schritte, sitNamen].join(' ').toLowerCase();
      return q.split(/\s+/).every(function (w) { return heu.indexOf(w) > -1; });
    }
    return true;
  });
  $('#regelListe').innerHTML = liste.length
    ? '<div class="liste">' + sortRegeln(liste).map(karte).join('') + '</div>'

/* =========================================================
   Dankbarkeit (Tagebuch)
   ========================================================= */
var DANK_N = ls('lk_dank_anzahl') || 3;
var DANK_ANSTOSS = ['Ein Moment, der gut tat', 'Ein Mensch, der freundlich war', 'Etwas an mir, das ich heute mochte', 'Etwas, das leichter war als gedacht', 'Etwas Schönes, das ich gesehen habe', 'Etwas, das mein Körper heute geschafft hat', 'Eine kleine Freude', 'Etwas, worauf ich mich freue', 'Ein Geräusch, ein Duft, ein Geschmack', 'Etwas, das ich gelernt habe'];
function tagIso(d) { function p(n) { return (n < 10 ? '0' : '') + n; } return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function heute() { return tagIso(new Date()); }
function dankAm(tag) { return D.Dankbarkeit.filter(function (x) { return x.datum === tag && x.text; }).sort(function (a, b) { return a.nr - b.nr; }); }

  var d = new Date(), n = 0;
  if (!dankAm(tagIso(d)).length) d.setDate(d.getDate() - 1);

  return n;
}
function dankKarte() {

    '<small>' + (fertig ? 'Schön.' + (s > 1 ? ' ' + s + ' Tage in Folge.' : '') : n + ' von ' + DANK_N + ' notiert' + (s > 1 ? ' · ' + s + ' Tage in Folge' : '')) + '</small></span>' +
    '<span class="punkte">' + punkte + '</span></button>';
}
VIEWS.dank = function (_, setTitel) {
  setTitel('Dankbarkeit');
  var tag = heute(), serie = dankSerie();
  var html = '<h2>Wofür bist du heute dankbar?</h2><p class="leise">' + esc(new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })) +

var ANSP_FARBE = ['#4F86C6', '#6B8EAE', '#869696', '#A29E7E', '#BDA666', '#D9AE4E', '#DC9841', '#DF8334', '#D86A3A', '#C84F52', '#B8336A']; // blau, gold, magenta: auch bei Rot-Grün-Schwäche unterscheidbar
function anspLog() { return D.SkillLog.filter(function (x) { return x.vorher !== '' && x.vorher != null; }).sort(function (a, b) { return a.datum < b.datum ? -1 : 1; }); }
function letzteAnsp() { var l = anspLog(); return l.length ? l[l.length - 1] : null; }

  var links = ringKnopf('checkin', art, art === 'morgen' ? 'sonne' : 'mond', CHECK[art].titel.replace('-Check-in', '-<wbr>Check-in'), ci ? 'erledigt' : '10 Sekunden', ci ? 1 : 0, !!ci);
  var rechts = ringKnopf('nav', 'dank', 'herz', 'Dankbarkeit', (n >= DANK_N ? DANK_N : n) + ' von ' + DANK_N, Math.min(1, n / DANK_N), n >= DANK_N);

function ringKnopf(act, id, sym, titel, sub, anteil, fertig) {

/* Ab Anspannung 7: der passendste Skill, ein Tippen öffnet direkt die Anleitung */

/* Tagesverlauf als Stimmungsband: gleichmäßige Zeitachse 6 bis 24 Uhr (alle 3 Stunden eine Marke),
   farbiges Band zwischen dem ersten und letzten Eintrag, darunter jeder Eintrag als Plakette.
   Farben blau (ruhig), gold (angespannt), magenta (am Limit): auch bei Rot-Grün-Schwäche gut zu unterscheiden.
   Die Maße stehen direkt am Element, damit die Grafik auch ohne die Styles-Datei stimmt. */
var TV_VON = 6, TV_BIS = 24, TV_MARKEN = [6, 9, 12, 15, 18, 21, 24];
function tagesVerlauf() {
  var tag = heute();
  var e = anspLog().filter(function (x) { return tagIso(new Date(x.datum)) === tag; });
  var std = function (d) { var t = new Date(d); return t.getHours() + t.getMinutes() / 60; };
  var px = function (h) { return Math.max(0, Math.min(100, (h - TV_VON) / (TV_BIS - TV_VON) * 100)); };
  var hhmm = function (d) { return new Date(d).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); };
  var band = '<rect x="0" y="0" width="100" height="10" style="fill:rgba(255,255,255,.05);stroke:none"/>';
  if (e.length) {
    var a = px(std(e[0].datum)), b = px(std(e[e.length - 1].datum));
    if (b - a < 1.2) { a = Math.max(0, a - .6); b = Math.min(100, b + .6); }
    var stops = e.map(function (x) {
      var o = b > a ? (px(std(x.datum)) - a) / (b - a) : 0;
      return '<stop offset="' + Math.max(0, Math.min(1, o)).toFixed(3) + '" stop-color="' + ANSP_FARBE[+x.vorher] + '"/>';
    }).join('');
    band += '<defs><linearGradient id="tvBand" x1="0" x2="1" y1="0" y2="0">' + stops + '</linearGradient></defs>' +
      '<rect x="' + a.toFixed(2) + '" y="0" width="' + (b - a).toFixed(2) + '" height="10" style="fill:url(#tvBand);stroke:none"/>';
  }
  var j = px(std(new Date()));
  band += '<rect x="' + (j - .2).toFixed(2) + '" y="0" width=".4" height="10" style="fill:#ECE6D8;fill-opacity:.7;stroke:none"/>';
  var striche = TV_MARKEN.slice(1, -1).map(function (h) {
    return '<i style="position:absolute;left:' + px(h) + '%;top:0;bottom:0;width:1px;background:rgba(0,0,0,.25)"></i>';
  }).join('');
  var achse = TV_MARKEN.map(function (h, i) {
    var tr = i === 0 ? 'translateX(0)' : i === TV_MARKEN.length - 1 ? 'translateX(-100%)' : 'translateX(-50%)';
    return '<span style="position:absolute;left:' + px(h) + '%;top:0;transform:' + tr + ';font-size:10.5px;line-height:16px;letter-spacing:0;white-space:nowrap;color:var(--muted)">' + h + '</span>';
  }).join('');
  var l = e.length ? e[e.length - 1] : null;
  var kopf = '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">' +
    '<span class="tv-kopf" style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700">Dein Tag</span>' +
    (l ? '<span style="font-size:13px;color:var(--muted)"><b style="font:400 20px var(--font-h);color:' + ANSP_FARBE[+l.vorher] + ';margin-right:5px">' + l.vorher + '</b>' + WORT[+l.vorher] + '</span>' : '') + '</div>';
  var chips = e.map(function (x) {
    var v = +x.vorher;
    return '<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12px;color:var(--ink-2)"' + (x.notiz ? ' title="' + esc(x.notiz) + '"' : '') + '>' +
      '<b style="display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:' + ANSP_FARBE[v] + ';color:' + (v <= 1 || v >= 9 ? '#fff' : '#14110c') + ';font-size:11px;font-weight:700">' + v + '</b>' + hhmm(x.datum) + (x.notiz ? ' ✎' : '') + '</span>';
  }).join('');
  var leg = '<div style="display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:11px;color:var(--muted)">' +
    [[1, 'ruhig'], [5, 'angespannt'], [10, 'am Limit']].map(function (p) {
      return '<span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:' + ANSP_FARBE[p[0]] + '"></i>' + p[1] + '</span>';
    }).join('') + '</div>';
  var unter;
  if (!e.length) {
    var lz = letzteAnsp();
    unter = '<p class="leise klein" style="margin:10px 0 0;text-align:center">' + esc(lz ? 'Heute noch kein Eintrag. Zuletzt am ' + datum(lz.datum) + ': ' + lz.vorher + '/10' : 'Noch nichts eingetragen.') + '</p>';
  } else {
    var s = 0, mx = 0; e.forEach(function (x) { s += +x.vorher; mx = Math.max(mx, +x.vorher); });
    unter = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">' + chips + '</div>' + leg +
      '<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--muted)"><span><b style="color:var(--ink-2)">' + e.length + '</b> ' + (e.length === 1 ? 'Eintrag' : 'Einträge') + '</span>' +
      '<span>Schnitt <b style="color:var(--ink-2)">' + (s / e.length).toFixed(1).replace('.', ',') + '</b></span><span>Höchster <b style="color:var(--ink-2)">' + mx + '</b></span></div>';
  }
  return '<div class="tagesverlauf" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">' + kopf +
    '<div style="position:relative;height:28px;border-radius:14px;overflow:hidden">' +
    '<svg viewBox="0 0 100 10" preserveAspectRatio="none" width="100%" height="28" style="display:block;width:100%;height:28px">' + band + '</svg>' + striche + '</div>' +
    '<div style="position:relative;height:16px;margin-top:5px">' + achse + '</div>' + unter + '</div>';
}

FW_TAB.verlauf = function () {

    return '<span>' + esc(fwZ(id).name) + '</span><span class="n">' + c[id] + ' von ' + n + ' Tagen</span><span class="b"><i style="width:' + (c[id] / n * 100) + '%"></i></span>';

/* ---------- Dankbarkeit als Sternbild im Hintergrund ---------- */
/* Feste Sternpositionen im Himmel; jeder Dankbarkeits-Moment der letzten 7 Tage lässt einen davon heller leuchten */
var HIMMEL = [[8,14],[18,32],[27,9],[36,24],[44,6],[57,18],[66,8],[74,28],[83,12],[92,22],[12,46],[24,58],[88,44],[94,62],[6,72],[16,86],[30,94],[48,88],[62,96],[78,84],[90,92],[70,62],[40,70],[55,40]];
function hashZahl(s) { var h = 0; s = String(s); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function dankLetzteWoche() {
  var set = {}; letzteTage(7).forEach(function (t) { set[t] = 1; });
  return D.Dankbarkeit.filter(function (x) { return x.text && set[x.datum]; });
}
function sternHimmel() {
  var box = $('#sternbildHimmel'); if (!box) return;
  var hell = HIMMEL.map(function () { return 0; });
  dankLetzteWoche().forEach(function (x) { hell[hashZahl(x.id || x.text) % HIMMEL.length]++; });
  var html = HIMMEL.map(function (p, i) {
    var n = Math.min(hell[i], 3);
    return '<i class="hs' + (n ? ' an' + n : '') + '" style="left:' + p[0] + '%;top:' + p[1] + '%"></i>';
  }).join('');
  if (box.dataset.h !== html) { box.innerHTML = html; box.dataset.h = html; }
}

/* ---------- Sternbild der Woche im Rückblick ---------- */
function sternbildWoche(w) {
  if (!w.dank.length) return '';
  var tage = letzteTage(7), W = 320, H = 150, P = 18;
  var punkte = w.dank.slice().sort(function (a, b) { return a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : (a.nr || 0) - (b.nr || 0); }).map(function (x) {
    var ti = tage.indexOf(x.datum), h = hashZahl((x.id || '') + x.text), m = Math.imul(h, 2654435761) >>> 0;
    return { x: P + (W - 2 * P) * (ti + .2 + (h % 60) / 100) / 7, y: P + (H - 2 * P) * (m % 1000) / 1000, t: x.text };
  });
  var linien = '';
  for (var i = 1; i < punkte.length; i++) linien += '<line x1="' + punkte[i - 1].x.toFixed(1) + '" y1="' + punkte[i - 1].y.toFixed(1) + '" x2="' + punkte[i].x.toFixed(1) + '" y2="' + punkte[i].y.toFixed(1) + '"/>';
  var sterne = punkte.map(function (p, i) {
    var r = i === punkte.length - 1 ? 3.4 : 2.4;
    return '<g><title>' + esc(p.t) + '</title><circle class="sb-schein" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (r * 3) + '"/><circle class="sb-stern" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + r + '"/></g>';
  }).join('');
  var achse = tage.map(function (t, i) { var d = new Date(t + 'T12:00'); return '<text x="' + (P + (W - 2 * P) * (i + .5) / 7).toFixed(1) + '" y="' + (H - 2) + '">' + ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][d.getDay()] + '</text>'; }).join('');
  var nTage = {}; w.dank.forEach(function (x) { nTage[x.datum] = 1; });
  return '<h3>Sternbild deiner Woche</h3><div class="block sternbild">' +
    '<svg viewBox="0 0 ' + W + ' ' + (H + 12) + '" role="img" aria-label="' + w.dank.length + ' dankbare Momente als Sternbild"><g class="sb-linien">' + linien + '</g>' + sterne + '<g class="sb-achse">' + achse + '</g></svg>' +
    '<p class="leise klein" style="margin:8px 0 0">' + w.dank.length + ' dankbare Momente an ' + Object.keys(nTage).length + ' Tagen. Jeder Stern ist einer davon, verbunden in der Reihenfolge, in der du sie notiert hast.</p></div>';
}

/* =========================================================
   flüssigere Kompass-Animation
   Zeiger als eigene Ebene (läuft auf der Grafikkarte), Bogen über
   stroke-dashoffset statt neuem Pfad, kein Schatten-Filter auf der Grafik.
   ========================================================= */
function roseAnspannung(v) {
  fwLetzterWert = v;
  var P = function (r, grad) { var a = grad * Math.PI / 180; return (100 + r * Math.sin(a)).toFixed(2) + ' ' + (100 - r * Math.cos(a)).toFixed(2); };
  var t = '';
  for (var i = 0; i <= 50; i++) {
    var g = -135 + i * 5.4, haupt = i % 5 === 0;
    t += '<path class="' + (haupt ? 'tick-h' : 'tick') + '" d="M' + P(88, g) + 'L' + P(88 - (haupt ? 7 : 3), g) + '"/>';
  }
  var zahlen = '';
  for (var z = 0; z <= 10; z++) { var xy = P(73, anspWinkel(z)).split(' '); zahlen += '<text class="grad' + (z === v ? ' an' : '') + '" x="' + xy[0] + '" y="' + xy[1] + '" dy="3">' + z + '</text>'; }
  var spitze = function (g, L, w, cls) {
    return '<path class="' + cls + '-l" d="M100 100L' + P(L, g) + 'L' + P(w, g - 45) + 'Z"/>' +
           '<path class="' + cls + '-d" d="M100 100L' + P(L, g) + 'L' + P(w, g + 45) + 'Z"/>';
  };
  var stern = '';
  [45, 135, 225, 315].forEach(function (g) { stern += spitze(g, 34, 8, 'neben'); });
  [90, 180, 270].forEach(function (g) { stern += spitze(g, 46, 10, 'haupt'); });
  stern += spitze(0, 62, 10, 'nord');
  var bogen = 'M' + P(82, -135) + 'A82 82 0 1 1 ' + P(82, 135);
  return '<div class="rose-w" id="anspRose" role="img" aria-label="Anspannung ' + v + ' von 10">' +
    '<svg class="rose ansp" viewBox="0 0 200 200" aria-hidden="true"><defs>' +
    '<linearGradient id="messing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3E2B3"/><stop offset=".45" stop-color="#C9A45C"/><stop offset="1" stop-color="#7A5A24"/></linearGradient>' +
    '<linearGradient id="messingD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B89049"/><stop offset="1" stop-color="#5E4318"/></linearGradient>' +
    '<radialGradient id="glanz" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="var(--glow)"/><stop offset="1" stop-color="var(--glow)" stop-opacity="0"/></radialGradient>' +
    '</defs>' +
    '<circle cx="100" cy="100" r="99" fill="url(#glanz)" stroke="none"/>' +
    '<circle class="bezel" cx="100" cy="100" r="96"/><circle class="bezel-2" cx="100" cy="100" r="92"/>' +
    '<path class="skala-bg" d="' + bogen + '"/>' +
    '<path class="skala-an" id="anspBogen" pathLength="100" d="' + bogen + '" stroke="' + ANSP_FARBE[v] + '" style="stroke-dashoffset:' + (100 - v * 10) + '"/>' +
    t + zahlen + '<circle class="ring-i" cx="100" cy="100" r="56"/></svg>' +
    '<div class="rose-zeiger" id="anspZeiger" style="transform:rotate(' + anspWinkel(v) + 'deg)"><div class="rose-pendel">' +
    '<svg class="rose ansp rose-nadel" viewBox="0 0 200 200" aria-hidden="true"><g class="stern">' + stern + '</g></svg></div></div>' +
    '<svg class="rose ansp rose-nadel" viewBox="0 0 200 200" aria-hidden="true"><circle class="mitte" cx="100" cy="100" r="5.5"/><circle class="mitte-p" cx="100" cy="100" r="1.8"/></svg>' +
    '</div>';
}
var fwLetzterWert = null;
function anspSetze(v) {
  if (v === fwLetzterWert) return;
  fwLetzterWert = v; TRACK.v = v;
  var z = $('#anspZeiger'); if (z) z.style.transform = 'rotate(' + anspWinkel(v) + 'deg)';
  var b = $('#anspBogen'); if (b) { b.style.strokeDashoffset = 100 - v * 10; b.setAttribute('stroke', ANSP_FARBE[v]); }
  $$('.rose.ansp .grad').forEach(function (t) { t.classList.toggle('an', +t.textContent === v); });
  var w = $('#anspWert'); if (w) { w.textContent = v; w.style.color = ANSP_FARBE[v]; }
  var wo = $('#anspWort'); if (wo) wo.textContent = WORT[v];
}
/* Beim Ziehen folgt die Nadel direkt, beim Loslassen federt sie aus */
function anspZiehen() {
  var r = $('#anspRegler'), rose = $('#anspRose');
  if (!r || !rose) return;
  var an = function () { rose.classList.add('zieht'); }, aus = function () { rose.classList.remove('zieht'); };
  r.addEventListener('pointerdown', an); r.addEventListener('touchstart', an, { passive: true });
  r.addEventListener('change', aus); r.addEventListener('pointerup', aus); r.addEventListener('touchend', aus);
}
